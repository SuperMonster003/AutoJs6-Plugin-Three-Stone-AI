name: Build and plugin contract

on:
  push:
    branches-ignore: [model-catalog]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check repository and generated documentation
        run: |
          python .python/check_repository.py
          python .python/generate_markdown.py --check
          python -m unittest discover -s .python -p 'test_*.py'

      - name: Unit tests, debug APKs and lint
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug :app:verifyDebugNativePageAlignment --stacktrace
      - name: Preserve APKs and native alignment evidence
        uses: actions/upload-artifact@v7
        with:
          name: stone-debug-apks
          path: app/build/outputs/apk
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v7
        with:
          name: stone-native-alignment
          path: app/build/reports/native-alignment
          if-no-files-found: error

  abi:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, arm64-v8a, x86, x86_64, universal]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: stone-debug-apks
          path: ci-apks
      - name: Verify each APK and its expected native payload
        run: python3 .github/scripts/verify_apk_contract.py --apk-dir ci-apks --abi '${{ matrix.abi }}'

  binder:
    name: Discovery and online AI on ${{ matrix.abi }} / ${{ matrix.page_size }} byte pages
    needs: [verify, abi]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: default
            api: 24
            arch: x86
            abi: x86
            page_size: 4096
          - target: google_apis
            api: 35
            arch: x86_64
            abi: x86_64
            page_size: 4096
          - target: google_apis_ps16k
            api: 35
            arch: x86_64
            abi: x86_64
            page_size: 16384
            # At the 2560 MB default a 16 KB image gets ~463 MiB of zram swap (API 36.1 measured; the
            # API 35 4 KB image gets ~1.8 GiB). Right after boot lmkd then kills down to oom_score_adj 0,
            # where the ~230 MB foreground instrumentation process lives: "Process crashed.".
            ram_size: 4096M
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: stone-debug-apks
          path: ci-apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # This executes discovery on the real page size; model inference and OEM acceptance remain separate.
      - name: Execute permission, discovery and Binder contract tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          target: ${{ matrix.target }}
          # Empty for the 4 KB images, which keep the runner default.
          ram-size: ${{ matrix.ram_size }}
          disable-animations: true
          script: python3 .github/scripts/verify_apk_contract.py --apk-dir ci-apks --abi ${{ matrix.abi }} --pagesize ${{ matrix.page_size }}
